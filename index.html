<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تابلوی زنده</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #24bde8;
      color: white;
      text-align: center;
    }

    #startBox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #startBtn {
      border: 0;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 18px;
      background: white;
      color: #168aad;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(0,0,0,.65);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>

  <div id="start">
    <div id="startBox">
      <h2>تابلوی زنده</h2>
      <p>برای شروع، اجازه دسترسی به دوربین را بده.</p>
      <button id="startBtn">شروع AR</button>
    </div>
  </div>

  <div id="hint">
    دوربین را روی عکس چاپ‌شده نگه دار.
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="video"
        src="./video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#video"
        width="1"
        height="0.7"
        position="0 0 0">
      </a-video>

    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#video");
    const start = document.querySelector("#start");
    const button = document.querySelector("#startBtn");
    const hint = document.querySelector("#hint");

    button.addEventListener("click", async () => {
      start.style.display = "none";
      hint.style.display = "block";

      const arSystem = scene.systems["mindar-image-system"];

      try {
        await arSystem.start();
      } catch (error) {
        console.error(error);
        start.style.display = "flex";
        alert("دسترسی به دوربین یا شروع AR انجام نشد.");
      }
    });

    scene.addEventListener("targetFound", async () => {
      try {
        video.currentTime = 0;
        await video.play();
      } catch (error) {
        console.log(error);
      }
    });

    scene.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>

</body>
</html>
