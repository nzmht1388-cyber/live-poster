<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #start button {
      padding: 16px 28px;
      font-size: 20px;
      border: 0;
      border-radius: 14px;
    }

    #testVideo {
      position: fixed;
      width: 160px;
      height: auto;
      right: 10px;
      bottom: 10px;
      z-index: 50;
      display: none;
    }
  </style>
</head>

<body>

<div id="start">
  <button id="startBtn">شروع AR</button>
</div>

<video
  id="testVideo"
  src="./video.mp4"
  muted
  playsinline
  webkit-playsinline
  controls>
</video>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes
  "
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="arVideo"
      src="./video.mp4"
      preload="auto"
      muted
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-plane
      width="1"
      height="0.7"
      material="shader: flat; src: #arVideo; side: double">
    </a-plane>

  </a-entity>

</a-scene>

<script>
  const scene = document.querySelector("a-scene");
  const start = document.querySelector("#start");
  const startBtn = document.querySelector("#startBtn");

  const testVideo = document.querySelector("#testVideo");
  const arVideo = document.querySelector("#arVideo");

  startBtn.addEventListener("click", async () => {

    start.style.display = "none";

    // ویدئوی تستی را نمایش می‌دهیم
    testVideo.style.display = "block";

    testVideo.muted = true;
    arVideo.muted = true;

    try {
      await testVideo.play();
      testVideo.pause();
      testVideo.currentTime = 0;
    } catch (e) {
      console.log(e);
    }

    try {
      await arVideo.play();
      arVideo.pause();
      arVideo.currentTime = 0;
    } catch (e) {
      console.log(e);
    }

    const arSystem = scene.systems["mindar-image-system"];

    if (arSystem) {
      arSystem.start();
    }
  });

  scene.addEventListener("targetFound", async () => {

    arVideo.currentTime = 0;

    try {
      await arVideo.play();
    } catch (e) {
      console.log(e);
    }
  });

  scene.addEventListener("targetLost", () => {
    arVideo.pause();
  });
</script>

</body>
</html>
