<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تابلوی زنده</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif}#start{position:fixed;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;text-align:center;padding:24px}button{border:0;border-radius:14px;padding:14px 24px;font-size:18px}#hint{position:fixed;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:9px 14px;border-radius:12px;display:none}</style>
</head>
<body>
<div id="start"><div><h2>تابلوی زنده</h2><p>برای شروع، اجازهٔ دوربین را بده.</p><button id="startBtn">شروع AR</button></div></div>
<div id="hint">دوربین را روی عکس چاپ‌شده نگه دار.</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-assets><video id="video" src="./video.mp4" preload="auto" playsinline webkit-playsinline muted crossorigin="anonymous"></video></a-assets>
<a-entity mindar-image-target="targetIndex:0"><a-video src="#video" width="1" height="0.7" position="0 0 0"></a-video></a-entity>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
</a-scene>
<script>
const scene=document.querySelector('a-scene'),v=document.querySelector('#video');
document.querySelector('#startBtn').onclick=async()=>{document.querySelector('#start').style.display='none';document.querySelector('#hint').style.display='block';await scene.systems['mindar-image-system'].start()};
scene.addEventListener('targetFound',async()=>{try{v.currentTime=0;await v.play()}catch(e){}});
scene.addEventListener('targetLost',()=>v.pause());
</script>
</body></html>
