<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #start button {
      padding: 16px 28px;
      font-size: 20px;
      border: 0;
      border-radius: 14px;
    }

    #sound {
      position: fixed;
      bottom: 30px;
      left: 0;
      right: 0;
      z-index: 200;
      text-align: center;
      display: none;
    }

    #sound button {
      padding: 14px 24px;
      font-size: 18px;
      border: 0;
      border-radius: 14px;
    }
  </style>
</head>

<body>

<div id="start">
  <button id="startBtn">شروع AR</button>
</div>

<div id="sound">
  <button id="soundBtn">🔊 پخش صدا</button>
</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: no;
    uiScanning: yes;
    uiError: yes
  "
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="video"
      src="./video.mp4"
      preload="auto"
      muted
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-plane
      id="videoPlane"
      width="1"
      height="0.5625"
      position="0 0 0"
      material="shader: flat; side: double; src: #video">
    </a-plane>

  </a-entity>

</a-scene>

<script>
  const scene = document.querySelector("a-scene");
  const video = document.querySelector("#video");
  const start = document.querySelector("#start");
  const startBtn = document.querySelector("#startBtn");
  const sound = document.querySelector("#sound");
  const soundBtn = document.querySelector("#soundBtn");
  const plane = document.querySelector("#videoPlane");

  video.muted = true;
  video.playsInline = true;

  startBtn.addEventListener("click", async () => {

    start.style.display = "none";

    video.load();

    try {
      await video.play();
      video.pause();
      video.currentTime = 0;
    } catch (e) {
      console.log(e);
    }

    const arSystem = scene.systems["mindar-image-system"];

    if (arSystem) {
      arSystem.start();
    }
  });

  scene.addEventListener("targetFound", async () => {

    plane.setAttribute(
      "material",
      "shader: flat; side: double; src: #video"
    );

    video.currentTime = 0;

    try {
      await video.play();
    } catch (e) {
      console.log(e);
    }

    sound.style.display = "block";
  });

  scene.addEventListener("targetLost", () => {
    video.pause();
    sound.style.display = "none";
  });

  soundBtn.addEventListener("click", async () => {

    video.muted = false;

    try {
      await video.play();
      sound.style.display = "none";
    } catch (e) {
      console.log(e);
    }
  });
</script>

</body>
</html>
